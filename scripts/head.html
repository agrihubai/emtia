<script src="vendor/d3-7.9.0.min.js"></script>
<script>
  // Küçük bir "dash" katmanı: Claude panosundaki sayfa kodunun burada da aynen çalışmasını sağlar.
  (function () {
    const FILES = { prices: 'data/emtia-fiyatlari.json', series: 'data/emtia-serileri.json', hypotheses: 'data/hipotez-karnesi.json', life: 'data/gunluk-hayat.json' };
    const DEFAULTS = { sel: ['food', 'wheat', 'cocoa', 'olive'], range: 'all', lang: 'tr' };
    const store = {}; const calcs = {}; const draws = {}; const listeners = [];
    let params = JSON.parse(JSON.stringify(DEFAULTS));
    let version = 0; const cache = {};
    const ok = (data) => ({ status: 'ok', data, columns: data.length ? Object.keys(data[0]) : [], refreshing: false, meta: [] });
    const loading = { status: 'loading', data: [], columns: [], refreshing: false, meta: [] };
    function data(id) {
      if (calcs[id]) {
        const c = calcs[id];
        if (cache[id] && cache[id].v === version) return cache[id].r;
        const ins = c.inputs.map((i) => data(i));
        let r;
        if (ins.some((x) => x.status === 'error')) r = { status: 'error', data: [], message: 'input failed' };
        else if (ins.some((x) => x.status !== 'ok')) r = loading;
        else { try { r = ok(c.fn(...ins.map((x) => x.data))); } catch (e) { console.error(id, e); r = { status: 'error', data: [], message: String(e) }; } }
        cache[id] = { v: version, r }; return r;
      }
      return store[id] || loading;
    }
    const visible = (el) => !el.closest('[hidden]');
    function runDraw(name) {
      const fn = draws[name]; if (!fn) return;
      for (const el of document.querySelectorAll(`[data-draw="${name}"]`)) {
        if (!visible(el)) continue;
        try { fn(el); } catch (e) { console.error('draw', name, e); }
      }
    }
    function render() {
      for (const f of listeners) { try { f(); } catch (e) { console.error(e); } }
      for (const n of Object.keys(draws)) runDraw(n);
    }
    let pending = false;
    const schedule = () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); };
    window.dash = {
      data, calc(id, def) { calcs[id] = def; },
      loader() {},
      draw(name, fn) { if (typeof fn === 'function') draws[name] = fn; if (ready) runDraw(name); },
      onData(fn) { listeners.push(fn); if (ready) fn(); },
      params: () => params,
      setParams(p) { for (const [k, v] of Object.entries(p)) { if (v === null) delete params[k]; else params[k] = v; } version++; schedule(); },
      resetParams() { params = JSON.parse(JSON.stringify(DEFAULTS)); version++; schedule(); },
      setLink(name) { try { history.replaceState(null, '', name ? '#' + name : location.pathname); } catch (e) {} },
      refresh() {},
      colors: ['#2f6b4f', '#c9832a', '#3f6fb5', '#b23b5f', '#6f7f2a', '#7a52b3', '#2a8a8a', '#8a5a3c'],
    };
    let ready = false;
    window.addEventListener('DOMContentLoaded', () => {
      ready = true; render();
      for (const [id, url] of Object.entries(FILES)) {
        fetch(url, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then((j) => { store[id] = ok(Array.isArray(j) ? j : (j.rows || j.data || [])); version++; schedule(); })
          .catch((e) => { store[id] = { status: 'error', data: [], message: String(e) }; version++; schedule(); });
      }
      let w = innerWidth;
      addEventListener('resize', () => { if (Math.abs(innerWidth - w) > 8) { w = innerWidth; version++; schedule(); } });
    });
  })();
</script>
