name: Fiyatları güncelle

on:
  schedule:
    - cron: "17 6 * * 1"   # her pazartesi 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FRED'den indir
        run: python scripts/update_prices.py
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- data/emtia-fiyatlari.json; then
            echo "Yeni veri yok."
          else
            git config user.name "agrihubai-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/emtia-fiyatlari.json
            git commit -m "Fiyatlar FRED'den güncellendi"
            git push
          fi
